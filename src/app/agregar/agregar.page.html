<ion-header [translucent]="true">

  <ion-toolbar>
    <ion-title>{{lista.titulo}}</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" color="tertiary">
      </ion-back-button>

    </ion-buttons>

  </ion-toolbar>

</ion-header>


<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Agregar</ion-title>
    </ion-toolbar>
  </ion-header>



</ion-content>



<ion-content>
  <ion-list>
    <ion-item>
      <ion-label position="floating">
        Nuevo Elemento
      </ion-label>
      <ion-input type="text" (keyup.enter)="agregar()" [(ngModel)]="nombreItem">
      </ion-input>
    </ion-item>
  </ion-list>
</ion-content>

<ion-list>
  <ion-list-header>
    <ion-label>
      Lista de actividades
    </ion-label>
  </ion-list-header>
  <ion-item-sliding *ngFor="let actividad of lista.item">
    <ion-item>
      <ion-checkbox slot="start"></ion-checkbox>
      {{ actividad.descripcion}}
    </ion-item>
  </ion-item-sliding>

</ion-list>
